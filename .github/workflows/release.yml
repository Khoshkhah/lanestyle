name: Release to PyPI

# Publish on a version tag (v0.1.0, ...) via PyPI trusted publishing: no API token stored.
# One-time setup on pypi.org: add a "trusted publisher" for this repo and workflow
# (project: lanestyle, owner: Khoshkhah, workflow: release.yml, environment: pypi).
# A release branch (release-*) and a run by hand build the wheels and the sdist only, to check them before the tag.
on:
  push:
    tags: ["v*"]
    branches: ["release-*"]
  workflow_dispatch:

jobs:
  # one wheel with the Rust engine in it for each platform (abi3: one wheel for every Python from 3.10)
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # the runners and the manylinux of duckOSM's wheels, which have the same bundled DuckDB: a native arm runner (the cross compiler
      # of the older manylinux image cannot build DuckDB 1.5) and manylinux 2_28
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-22.04, target: x86_64, manylinux: "2_28"}
          - {name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28"}
          - {name: macos-x86_64, runner: macos-15-intel, target: x86_64}
          - {name: macos-aarch64, runner: macos-latest, target: aarch64}
          - {name: windows-x64, runner: windows-latest, target: x64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile dist --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - name: The wheel imports and calls its Rust engine (a new virtual environment)
        shell: bash
        run: |
          set -e
          python -m venv test-env
          if [ -f test-env/Scripts/activate ]; then source test-env/Scripts/activate; else source test-env/bin/activate; fi
          pip install dist/*.whl
          cd tests && python -c "import lanestyle as ls; assert ls.lane_settings()['default_width_m'] == 3.25; print('lanestyle', ls.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
