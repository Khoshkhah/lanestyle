name: Deploy docs

# Build the MkDocs (Material) site and publish it to GitHub Pages via the GitHub Actions
# deployment (no gh-pages branch). Runs when something that affects the docs changes on master,
# plus a manual trigger.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/lanestyle/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install ".[docs]"

      # The live map (docs/maps/monaco.html) is committed, built locally by docs/build_maps.py: the GMNS export needs SUMO.

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site (strict - fail on any broken link or nav reference)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
