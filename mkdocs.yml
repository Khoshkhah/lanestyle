site_name: lanestyle
site_description: Lane-level road maps for Python - every lane drawn at its real width, with lane lines, turns and a click-to-see-connectivity view, from a lane table or a duckOSM GMNS database
site_url: https://khoshkhah.github.io/lanestyle/
repo_url: https://github.com/Khoshkhah/lanestyle
repo_name: Khoshkhah/lanestyle

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: get-started.md
  - Guides:
      - guides/index.md
      - The lane table: guides/lane-table.md
      - Lane lines: guides/lane-lines.md
      - Footpaths, levels, connectors: guides/footpaths-and-levels.md
      - Turns, clicks and labels: guides/turns.md
      - From OSM to lanes (duckOSM): pipeline.md
      - Put it on a website: guides/website.md
      - AI agents: guides/agents.md
  - Gallery: gallery.md
  - Live map: maps/monaco.html
  - Reference:
      - Python API: reference/python.md
      - Settings: reference/settings.md
      - Command line: reference/cli.md
  - Design notes:
      - design/index.md
      - lanestyle on roadstyle: design/lanestyle_on_roadstyle.md
      - Pedestrian lanes: design/pedestrian_lanes.md
      - GMNS CSV input: design/gmns_csv_input.md
      - One file, link_osm: design/gmns_link_osm.md

plugins:
  - search
  # /llms.txt (an index for AI agents, llmstxt.org) and /llms-full.txt (every page as Markdown)
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        lanestyle draws lane-level road maps as one offline HTML page: every lane at its real
        width, with lane lines, turns and a click that shows where a lane leads, from a lane table
        or a duckOSM GMNS database, built on roadstyle. An agent skill with the essentials:
        https://github.com/Khoshkhah/lanestyle/blob/master/skills/lanestyle/SKILL.md
      sections:
        Get started:
          - index.md
          - get-started.md
        Guides:
          - guides/lane-table.md
          - guides/lane-lines.md
          - guides/turns.md
          - pipeline.md
          - guides/website.md
          - guides/agents.md
        Reference:
          - reference/python.md
          - reference/settings.md
          - reference/cli.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# the builders are scripts, not pages
exclude_docs: |
  build_*.py
