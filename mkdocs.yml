site_name: lanestyle
site_description: Lane-level road maps for Python - every lane drawn at its real width, with lane lines, turns and a click-to-see-connectivity view, from a lane table or a duckOSM GMNS database
site_url: https://khoshkhah.github.io/lanestyle/
repo_url: https://github.com/Khoshkhah/lanestyle
repo_name: Khoshkhah/lanestyle

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: get-started.md
  - Guides:
      - guides/index.md
      - The lane table: guides/lane-table.md
      - Lane lines: guides/lane-lines.md
      - Turns, clicks and labels: guides/turns.md
      - From OSM to lanes (duckOSM): pipeline.md
      - Put it on a website: guides/website.md
  - Gallery: gallery.md
  - Reference:
      - Python API: reference/python.md
      - Settings: reference/settings.md
      - Command line: reference/cli.md
  - Design notes:
      - design/index.md
      - lanestyle on roadstyle: design/lanestyle_on_roadstyle.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# the builders are scripts, not pages
exclude_docs: |
  build_*.py
