site_name: lanestyle
site_description: Lane-level road maps for Python on roadstyle - every road as wide as its lanes, with bus and bike lanes, lane lines, turn arrows, zebra crossings and sidewalks, from duckOSM's GMNS lanes
site_url: https://khoshkhah.github.io/lanestyle/
repo_url: https://github.com/Khoshkhah/lanestyle
repo_name: Khoshkhah/lanestyle

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: get-started.md
  - Guides:
      - guides/index.md
      - Lanes and markings: guides/lanes-and-markings.md
      - Junctions, zebras and sidewalks: guides/junctions-zebras-sidewalks.md
      - Fix the drawing in the editor: guides/editor.md
      - Settings: guides/settings.md
      - AI agents: guides/agents.md
  - Gallery: gallery.md
  - Live map: maps/monaco.html
  - Reference:
      - Python API: reference/python.md
      - Command line: reference/cli.md

plugins:
  - search
  # /llms.txt (an index for AI agents, llmstxt.org) and /llms-full.txt (every page as Markdown)
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        lanestyle draws lane-level road maps as one offline HTML page on roadstyle: every road as wide
        as its lanes, with bus and bike lanes, lane lines, turn arrows, zebra crossings and sidewalks,
        from duckOSM's GMNS lanes and level area. An agent skill with the essentials:
        https://github.com/Khoshkhah/lanestyle/blob/master/skills/lanestyle/SKILL.md
      sections:
        Get started:
          - index.md
          - get-started.md
        Guides:
          - guides/lanes-and-markings.md
          - guides/junctions-zebras-sidewalks.md
          - guides/editor.md
          - guides/settings.md
          - guides/agents.md
        Reference:
          - reference/python.md
          - reference/cli.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# the builders are scripts, not pages
exclude_docs: |
  build_*.py
  design/
