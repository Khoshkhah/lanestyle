[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lanestyle"
version = "0.4.0"
description = "Lane-level maps on roadstyle, from a lane table or a duckOSM GMNS db"
authors = [{ name = "Kaveh" }]
requires-python = ">=3.10"
dependencies = ["roadstyle>=0.11", "geopandas", "shapely", "duckdb"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lanestyle = ["data/*.json"]
