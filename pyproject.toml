[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lanestyle"
version = "0.1.0"
description = "Standalone lane-level maps from a duckOSM GMNS db (folium; no mapstyle dependency)"
authors = [{ name = "Kaveh" }]
requires-python = ">=3.10"
dependencies = ["folium", "geopandas", "shapely", "duckdb"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
